name: iprefer
description: "I prefer — photograph a thing you love, caption it, keep a quiet record of your taste."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State (simple — no heavy architecture)
  provider: ^6.1.2

  # Local storage (no backend in this pass)
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Compose
  image_picker: ^1.1.2

  # Place + time: where you were when you liked it
  geolocator: ^13.0.1
  geocoding: ^5.0.0

  # Map of your preferences. OpenStreetMap tiles — no API key on either
  # platform. Swap the tile URL for a paid source before shipping at volume.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Card rendering / color extraction
  palette_generator: ^0.3.3+5

  # Saving photos + exported PNGs into app documents
  path_provider: ^2.1.4
  path: ^1.9.0

  # Secondary share of the rendered image
  share_plus: ^10.0.2

  # ids
  uuid: ^4.4.2

  # date formatting on the card
  intl: ^0.19.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  # Bundled serif so the card looks right regardless of device fonts.
  # Playfair Display (OFL) — variable weight; we lean on the italic for the signature.
  fonts:
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf
        - asset: assets/fonts/PlayfairDisplay-Italic-Variable.ttf
          style: italic
